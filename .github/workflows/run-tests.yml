name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      client:
        description: Client folder under clients/
        type: string
        default: toolshop
      env:
        description: Target environment (TEST_ENV)
        type: string
        default: dev
      project:
        description: Playwright project
        type: choice
        options: ['', ui, api]
        default: ''

jobs:
  test:
    uses: ./.github/workflows/test-execution.yml
    with:
      client: ${{ inputs.client || 'toolshop' }}
      env: ${{ inputs.env || 'dev' }}
      project: ${{ inputs.project || '' }}
    secrets:
      APP_EMAIL: customer@practicesoftwaretesting.com
      APP_PASSWORD: welcome01

name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      client:
        description: Client folder under clients/
        type: string
        default: toolshop
      env:
        description: Target environment (TEST_ENV)
        type: string
        default: dev
      project:
        description: Playwright project (empty runs the full suite - setup, ui, api and packs)
        type: choice
        options: ['', ui, api, packs]
        default: ''

jobs:
  test:
    uses: ./.github/workflows/test-execution.yml
    with:
      client: ${{ inputs.client || 'toolshop' }}
      env: ${{ inputs.env || 'dev' }}
      # Push and pull request run only the api project: the demo site's bot protection blocks the UI login
      # on CI runners. A manual run (workflow_dispatch) uses the chosen project, or the full suite when empty.
      project: ${{ github.event_name == 'workflow_dispatch' && inputs.project || github.event_name != 'workflow_dispatch' && 'api' || '' }}
    secrets:
      APP_EMAIL: customer@practicesoftwaretesting.com
      APP_PASSWORD: welcome01

  packs:
    # Core action packs tested against real MUI in the browser. They need no network, so push and
    # pull request run them next to api. A manual run covers them through the project input.
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/test-execution.yml
    with:
      client: toolshop
      env: dev
      project: packs
